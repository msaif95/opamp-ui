name: release
on:
  workflow_dispatch:
    inputs:
      version: { description: "Release version (MAJOR.MINOR.PATCH)", required: true }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, packages: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: '[[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be MAJOR.MINOR.PATCH"; exit 1; }'
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version && npm run lint && npm test && npm run build
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - run: |
          IMG=ghcr.io/${{ github.repository_owner }}/opamp-ui:${{ inputs.version }}
          docker build -t $IMG . && docker push $IMG
          echo "- \`$IMG\` $(docker inspect --format='{{index .RepoDigests 0}}' $IMG | cut -d@ -f2)" > digests.md
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json && git commit -m "Release ${{ inputs.version }}" && git tag -a "v${{ inputs.version }}" -m "opamp-ui ${{ inputs.version }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
      - uses: softprops/action-gh-release@v3
        with: { tag_name: 'v${{ inputs.version }}', name: 'opamp-ui ${{ inputs.version }}', body_path: digests.md, generate_release_notes: true }
